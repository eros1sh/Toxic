[package]
name = "toxic-cli"
description = "Toxic disk şifreleme komut satırı arayüzü"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "toxic"
path = "src/main.rs"

[dependencies]
toxic-core = { workspace = true, features = ["std"] }
anyhow    = { workspace = true }
clap      = { workspace = true }
hex       = "0.4.3"
rand_core = { workspace = true, features = ["getrandom"] }
rpassword = { workspace = true }

[lints]
workspace = true
