[workspace]
resolver = "2"
members = [
    "crates/toxic-core",
    "crates/toxic-cipher",
    "crates/toxic-cli",
    "crates/toxic-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
toxic-core   = { path = "crates/toxic-core",   default-features = false }
toxic-cipher = { path = "crates/toxic-cipher", default-features = false }
toxic-ipc    = { path = "crates/toxic-ipc",    default-features = false }

# Kriptografi
aes              = { version = "0.8.4",  default-features = false }
argon2           = { version = "0.5.3",  default-features = false, features = ["alloc", "zeroize"] }
blake2           = { version = "0.10.6", default-features = false }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["heapless"] }
rand_core        = { version = "0.6.4",  default-features = false }
serpent          = { version = "0.6.0",  default-features = false }
subtle           = { version = "2.6.1",  default-features = false }
twofish          = { version = "0.8.0",  default-features = false }
unicode-normalization = { version = "0.1.24", default-features = false }
# xts-mode kaldırıldı: serpent/twofish cipher 0.3.x, aes cipher 0.4.x — trait uyumsuzluğu.
# XTS toxic-cipher/src/raw_xts.rs içinde closure tabanlı olarak implement edildi.
zeroize          = { version = "1.8.1",  default-features = false, features = ["alloc", "zeroize_derive"] }

# Kullanıcı alanı
anyhow     = "1.0.98"
clap       = { version = "4.5.40", features = ["derive"] }
rpassword  = "7.4.0"
serde      = { version = "1.0",    default-features = false, features = ["derive"] }
serde_json = { version = "1.0",    default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Kripto crate'leri debug derlemede optimize et (testler yavaş olmasın).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.serpent]
opt-level = 3
[profile.dev.package.twofish]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
